---
# yamllint disable rule:line-length
name: make
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: make-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ubuntu-24.04-jdk-11-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-24.04-jdk-11-maven-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make
  telegram:
    needs: make
    runs-on: ubuntu-24.04
    if: ${{ always() && github.event_name == 'push' }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@a0ef862a24f962a4258fd9390d0a67b5529f0eef  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
