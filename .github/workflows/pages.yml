---
# yamllint disable rule:line-length
name: pages
'on':
  push:
    branches:
      - master
    tags:
      - '*'
  release:
concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false
jobs:
  pages:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p data
          find objects -name '*.eo' > data/objectionary.lst
          git fetch --tags --all --force
          git tag --list --format='%(*objectname) %(refname:short)' | grep '^[a-f0-9]' > data/tags.txt
          echo "$(git rev-parse HEAD) master" >> data/tags.txt
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: data
          clean: false
